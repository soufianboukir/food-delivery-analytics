name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # 3. Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Code formatting check (Black)
    - name: Check code formatting (Black)
      run: |
        pip install black
        black . --check

    # 5. Linting (Ruff - modern alternative to flake8)
    - name: Lint code (Ruff)
      run: |
        pip install ruff
        ruff check .

    # 6. Run unit tests (PyTest)
    - name: Run tests
      run: |
        pip install pytest
        pytest -v

    # 7. Optional: test notebook execution (if needed)
    - name: Check notebooks (optional)
      run: |
        pip install nbconvert
        jupyter nbconvert --to notebook --execute --inplace notebooks/*.ipynb